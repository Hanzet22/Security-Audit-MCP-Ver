name: Bootstrap fast-check test dependency (temporary)

on:
  push:
    branches: ["audit/npm-lockfile-bootstrap"]
    paths:
      - "package.json"
      - ".github/workflows/bootstrap-fast-check.yml"

permissions:
  contents: write

jobs:
  add-property-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Add fast-check without lifecycle scripts
        run: npm install --save-dev fast-check --ignore-scripts --no-audit --no-fund

      - name: Commit dependency manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "test: add fast-check property testing"
          git push origin HEAD:audit/npm-lockfile-bootstrap
