name: Bootstrap npm lockfile (temporary)

on:
  push:
    branches: ["audit/npm-lockfile-bootstrap"]
    paths:
      - "package.json"
      - ".github/workflows/bootstrap-lockfile.yml"

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Generate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        run: |
          test -s package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore(deps): generate npm lockfile"
          git push origin HEAD:audit/npm-lockfile-bootstrap
