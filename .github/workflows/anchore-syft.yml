# Generate an SPDX SBOM directly from the repository source.
# No Dockerfile or container build is required.
name: Anchore Syft SBOM

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for GitHub Dependency Submission API
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate source SBOM
        uses: anchore/sbom-action@bb716408e75840bbb01e839347cd213767269d4a # pinned commit
        with:
          path: ./
          artifact-name: security-audit-mcp-ver.spdx.json
          dependency-snapshot: true
          upload-artifact: true
          upload-release-assets: false
