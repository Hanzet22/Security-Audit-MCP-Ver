# Generate a source SBOM and submit the dependency snapshot with least privilege.
name: Anchore Syft SBOM

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./
          artifact-name: security-audit-mcp-ver-sbom
          upload-artifact: true
          upload-release-assets: false

  dependency-submission:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for GitHub Dependency Submission API
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Submit dependency snapshot
        uses: anchore/sbom-action@bb716408e75840bbb01e839347cd213767269d4a # pinned commit
        with:
          path: ./
          dependency-snapshot: true
          upload-artifact: false
          upload-release-assets: false
